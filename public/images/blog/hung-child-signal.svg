<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <text x="450" y="34" text-anchor="middle" fill="#6a7380" font-size="12" letter-spacing="6">READ  COST  AND  RUNTIME  AS  A  PAIR</text>

  <!-- ── axes ───────────────────────────────────────────────────────────── -->
  <!-- x: runtime 0..3h15m maps 110..790 · y: cost 0..$4 maps 350..90 -->
  <line x1="110" y1="350" x2="800" y2="350" stroke="#30363d" stroke-width="1"/>
  <line x1="110" y1="350" x2="110" y2="85"  stroke="#30363d" stroke-width="1"/>

  <g font-size="11" fill="#6b7280">
    <line x1="110" y1="285" x2="790" y2="285" stroke="#1f242c"/>
    <text x="98" y="289" text-anchor="end">$1</text>
    <line x1="110" y1="220" x2="790" y2="220" stroke="#1f242c"/>
    <text x="98" y="224" text-anchor="end">$2</text>
    <line x1="110" y1="155" x2="790" y2="155" stroke="#1f242c"/>
    <text x="98" y="159" text-anchor="end">$3</text>
    <text x="98" y="354" text-anchor="end">$0</text>
    <text x="110" y="372" text-anchor="middle">0m</text>
    <text x="345" y="372" text-anchor="middle">45m</text>
    <text x="580" y="372" text-anchor="middle">1h30m</text>
    <text x="790" y="372" text-anchor="middle">3h15m</text>
    <text x="450" y="392" text-anchor="middle" fill="#8a94a6" letter-spacing="2">RUNTIME</text>
  </g>

  <!-- ── the working child: cost climbs with runtime ─────────────────────── -->
  <path d="M 110,350 Q 200,320 280,285 T 450,205 T 620,140 L 700,112"
        fill="none" stroke="#6494be" stroke-width="3"/>
  <circle cx="700" cy="112" r="4.5" fill="#6494be"/>
  <line x1="706" y1="110" x2="726" y2="104" stroke="#6494be" stroke-width="1" opacity="0.6"/>
  <text x="732" y="100" font-size="12" fill="#6494be" font-weight="700">working</text>
  <text x="732" y="116" font-size="11" fill="#6a7380">both climbing</text>

  <!-- ── the hung child: cost flat at $1.98 while runtime runs on ────────── -->
  <path d="M 110,350 Q 150,300 185,224" fill="none" stroke="#f0883e" stroke-width="3"/>
  <line x1="185" y1="224" x2="790" y2="224" stroke="#f0883e" stroke-width="3" stroke-dasharray="7 5"/>
  <circle cx="185" cy="224" r="4.5" fill="#f0883e"/>
  <circle cx="790" cy="224" r="4.5" fill="#f0883e"/>

  <!-- where it stopped spending -->
  <line x1="185" y1="224" x2="185" y2="350" stroke="#f0883e" stroke-width="1" stroke-dasharray="3 4" opacity="0.55"/>
  <text x="192" y="345" font-size="11" fill="#f0883e" opacity="0.85">last tool call starts</text>

  <!-- knockout so the dashed line does not run through the label -->
  <rect x="368" y="198" width="204" height="20" rx="4" fill="#0d1117" opacity="0.92"/>
  <text x="470" y="212" text-anchor="middle" font-size="12" fill="#f0883e" font-weight="700">$1.98 &#8212; flat for 3 hours</text>
  <text x="804" y="228" font-size="12" fill="#f0883e" font-weight="700">HUNG</text>

  <!-- ── legend ──────────────────────────────────────────────────────────── -->
  <g font-size="12">
    <line x1="560" y1="72" x2="586" y2="72" stroke="#6494be" stroke-width="3"/>
    <text x="594" y="76" fill="#c9d1d9">cost climbing + runtime climbing</text>
    <line x1="560" y1="94" x2="586" y2="94" stroke="#f0883e" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="594" y="98" fill="#c9d1d9">cost FLAT + runtime climbing</text>
  </g>

  <!-- ── the operational consequence ─────────────────────────────────────── -->
  <g transform="translate(110,414)" font-size="12">
    <circle cx="0" cy="-4" r="3" fill="#f0883e"/>
    <text x="12" y="0" fill="#c9d1d9">A steer cannot rescue it &#8212; steers queue until the tool call returns, and it never does.</text>
  </g>
  <g transform="translate(110,436)" font-size="12">
    <circle cx="0" cy="-4" r="3" fill="#6494be"/>
    <text x="12" y="0" fill="#c9d1d9">Capture the pane first, then <tspan fill="#8bb9e0">kill</tspan>. It is the only lever, and the MLR dies with the pane.</text>
  </g>

  <text x="860" y="452" text-anchor="end" font-family="Georgia, serif" font-size="15" fill="#6494be" opacity="0.7">&#963;</text>
</svg>
