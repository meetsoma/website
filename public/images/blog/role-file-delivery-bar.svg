<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <text x="450" y="34" text-anchor="middle" fill="#6a7380" font-size="12" letter-spacing="6">WHAT  A  ROLE  FILE  SAYS  vs  WHAT  THE  CHILD  GETS</text>

  <text x="80" y="72" fill="#8a94a6" font-size="12" letter-spacing="2">30  ROLE  FILES  &#183;  207,436  AUTHORED  CHARACTERS</text>

  <!-- ── BEFORE ──────────────────────────────────────────────────────────── -->
  <g transform="translate(80,96)">
    <text x="0" y="0" fill="#6a7380" font-size="12" letter-spacing="2">BEFORE</text>

    <!-- track -->
    <rect x="0" y="14" width="740" height="62" rx="8"
          fill="rgba(22,27,34,0.7)" stroke="rgba(100,148,190,0.25)" stroke-width="1"/>

    <!-- delivered 37% = 277px -->
    <rect x="0" y="14" width="277" height="62" rx="8" fill="rgba(100,148,190,0.5)"/>
    <text x="138" y="52" text-anchor="middle" fill="#e4eaf4" font-size="17" font-weight="700">37%</text>

    <!-- dropped, hatched -->
    <defs>
      <pattern id="drop" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <rect width="8" height="8" fill="rgba(240,136,62,0.08)"/>
        <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(240,136,62,0.45)" stroke-width="2"/>
      </pattern>
    </defs>
    <rect x="277" y="14" width="463" height="62" fill="url(#drop)"/>
    <line x1="277" y1="8" x2="277" y2="82" stroke="#f0883e" stroke-width="1.5"/>
    <text x="508" y="46" text-anchor="middle" fill="#f0883e" font-size="15" font-weight="700">129,858 characters, dropped</text>
    <text x="508" y="64" text-anchor="middle" fill="#f0883e" font-size="11" opacity="0.85">no error, no warning, no log line</text>
  </g>

  <!-- what was in the dropped half -->
  <g transform="translate(80,196)" font-size="12">
    <text x="0" y="0" fill="#8a94a6" letter-spacing="2">WHAT  WAS  IN  IT</text>
    <g transform="translate(0,24)">
      <circle cx="0" cy="-4" r="3" fill="#f0883e"/>
      <text x="12" y="0" fill="#c9d1d9">## Working method &#183; ## Boundaries &#183; ## Report shape &#183; ## Hard rules</text>
    </g>
    <g transform="translate(0,44)">
      <circle cx="0" cy="-4" r="3" fill="#f0883e"/>
      <text x="12" y="0" fill="#c9d1d9">7 roles spawned with a <tspan font-weight="700">completely blank identity</tspan> &#8212; including the auditor</text>
    </g>
    <g transform="translate(0,64)">
      <circle cx="0" cy="-4" r="3" fill="#f0883e"/>
      <text x="12" y="0" fill="#c9d1d9">one role delivered 40 characters of the 14,921 its author wrote</text>
    </g>
  </g>

  <!-- ── AFTER ───────────────────────────────────────────────────────────── -->
  <g transform="translate(80,296)">
    <text x="0" y="0" fill="#6a7380" font-size="12" letter-spacing="2">AFTER</text>

    <rect x="0" y="14" width="740" height="62" rx="8"
          fill="rgba(22,27,34,0.7)" stroke="rgba(100,148,190,0.25)" stroke-width="1"/>
    <rect x="0" y="14" width="733" height="62" rx="8" fill="rgba(100,148,190,0.5)"/>
    <text x="366" y="52" text-anchor="middle" fill="#e4eaf4" font-size="17" font-weight="700">99% delivered</text>

    <line x1="733" y1="8" x2="733" y2="94" stroke="#6494be" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="740" y="102" fill="#8bb9e0" font-size="11">## MLRX notes &#8212; withheld on purpose</text>
  </g>

  <text x="450" y="418" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#8b949e">
    Everything is delivered unless it is named. An allow-list would have made the silence permanent.
  </text>

  <text x="860" y="428" text-anchor="end" font-family="Georgia, serif" font-size="15" fill="#6494be" opacity="0.7">&#963;</text>
</svg>
