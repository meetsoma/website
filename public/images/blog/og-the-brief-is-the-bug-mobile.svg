<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1020" viewBox="0 0 600 1020" role="img" aria-label="The Brief Is the Bug — three delegation failures, all reported as successes.">
  <defs>
    <radialGradient id="bg-m" cx="50%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#182030"/>
      <stop offset="100%" stop-color="#0b0f15"/>
    </radialGradient>
    <pattern id="grid-m" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" stroke="#6494be" stroke-width="0.3" opacity="0.06" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="1020" fill="url(#bg-m)"/>
  <rect width="600" height="1020" fill="url(#grid-m)"/>

  <!-- category -->
  <text x="48" y="110" style="font-family: 'SF Mono', monospace; font-size: 14px; fill: #6494be; letter-spacing: 5px; opacity: 0.85; font-weight: 600;">DELEGATION</text>

  <!-- hero -->
  <text x="48" y="212" style="font-family: Georgia, serif; font-size: 76px; fill: #e4eaf4; font-weight: 700; letter-spacing: -2px;">The Brief</text>
  <text x="48" y="292" style="font-family: Georgia, serif; font-size: 76px; fill: #f0883e; font-style: italic; font-weight: 700; letter-spacing: -2px;">Is the Bug.</text>

  <!-- sub -->
  <text x="48" y="358" style="font-family: Georgia, serif; font-size: 24px; fill: #c9d1d9; font-style: italic; opacity: 0.85;">I sorted every delegation failure</text>
  <text x="48" y="392" style="font-family: Georgia, serif; font-size: 24px; fill: #c9d1d9; font-style: italic; opacity: 0.85;">by cause. Almost none of them</text>
  <text x="48" y="426" style="font-family: Georgia, serif; font-size: 24px; fill: #c9d1d9; font-style: italic; opacity: 0.85;">were the model.</text>

  <!-- visual — three green lies, stacked -->
  <g transform="translate(48, 484)">
    <rect x="0" y="0" width="504" height="326" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="20" r="5" fill="#ff5f56"/>
    <circle cx="38" cy="20" r="5" fill="#ffbd2e"/>
    <circle cx="56" cy="20" r="5" fill="#27c93f"/>

    <g transform="translate(24, 62)">
      <text x="0" y="0" font-family="'SF Mono', monospace" font-size="13" fill="#28c840" font-weight="600">&#10003; REPORTED</text>
      <text x="250" y="0" font-family="'SF Mono', monospace" font-size="13" fill="#f85149" font-weight="600" letter-spacing="1">ACTUALLY</text>
    </g>
    <line x1="24" y1="78" x2="480" y2="78" stroke="#30363d" stroke-width="1"/>

    <g font-family="'SF Mono', monospace" font-size="13.5">
      <g transform="translate(24, 118)">
        <text x="0" y="0" fill="#28c840">&#10003;</text>
        <text x="22" y="0" fill="#c9d1d9">Status: running</text>
        <text x="250" y="0" fill="#8b949e">a dead shell</text>
      </g>
      <g transform="translate(24, 176)">
        <text x="0" y="0" fill="#28c840">&#10003;</text>
        <text x="22" y="0" fill="#c9d1d9">message sent</text>
        <text x="250" y="0" fill="#8b949e">never read</text>
      </g>
      <g transform="translate(24, 234)">
        <text x="0" y="0" fill="#28c840">&#10003;</text>
        <text x="22" y="0" fill="#c9d1d9">$1.98 · 3h15m</text>
        <text x="250" y="0" fill="#8b949e">hung, not working</text>
      </g>
    </g>

    <text x="252" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#f0883e" opacity="0.9">Every status surface said yes.</text>
  </g>

  <!-- headline stat -->
  <text x="48" y="878" font-family="Georgia, serif" font-size="38" fill="#e4eaf4" font-weight="700">37% <tspan fill="#6e7681" font-size="28">&#8594;</tspan> <tspan fill="#28c840">99%</tspan></text>
  <text x="48" y="908" font-family="'SF Mono', monospace" font-size="13" fill="#c9d1d9" opacity="0.75">of every role file actually reached the child</text>
  <text x="48" y="932" font-family="'SF Mono', monospace" font-size="13" fill="#f0883e" opacity="0.9">129,858 characters were dropped in silence</text>

  <!-- brand bar -->
  <line x1="48" y1="970" x2="552" y2="970" stroke="#30363d" stroke-width="1"/>
  <text x="48" y="1000" style="font-family: 'SF Mono', monospace; font-size: 15px; fill: #6494be; letter-spacing: 5px; font-weight: 600;">SOMA</text>
  <text x="552" y="1000" text-anchor="end" style="font-family: 'SF Mono', monospace; font-size: 13px; fill: #6e7681; letter-spacing: 1px;">soma.gravicity.ai</text>
</svg>
